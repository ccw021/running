<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標點符號跑酷</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB; /* 天空藍 */
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 滾動背景風景 */
        .scenery {
            position: absolute;
            bottom: 25%;
            white-space: nowrap;
            font-size: 80px;
            animation: scrollBg 20s linear infinite;
            z-index: 5;
        }
        
        @keyframes scrollBg {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 滾動地面 */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            background: repeating-linear-gradient(
                90deg,
                #8BC34A,
                #8BC34A 60px,
                #7CB342 60px,
                #7CB342 120px
            );
            animation: groundScroll 1.5s linear infinite;
            z-index: 10;
            border-top: 10px solid #558B2F;
        }

        @keyframes groundScroll {
            0% { background-position: 0 0; }
            100% { background-position: -120px 0; }
        }

        /* 介面 UI */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            z-index: 100;
            pointer-events: none;
            text-shadow: 2px 2px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF;
        }

        #question-box {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 50px;
            border-radius: 40px;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 6px solid #FF9800;
            color: #222;
            z-index: 100;
            white-space: nowrap;
            text-align: center;
        }

        .highlight {
            color: #E91E63;
            font-weight: 900;
        }

        /* 玩家角色 */
        #player {
            position: absolute;
            left: 15%;
            transition: top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 50;
            margin-top: -50px;
        }

        #player-sprite {
            font-size: 100px;
            animation: runBounce 0.35s alternate infinite;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }

        @keyframes runBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        /* 跑道位置 (30% 及 60%) */
        .lane-top { top: 30%; }
        .lane-bottom { top: 60%; }

        /* 標點符號平台/泡泡 */
        .platform {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #FFF;
            border: 6px solid #2196F3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            z-index: 40;
            margin-top: -50px;
            transition: all 0.3s;
            color: #333;
        }

        /* 互動效果 */
        .glow-correct #player-sprite,
        .glow-correct.platform {
            filter: drop-shadow(0 0 20px #4CAF50);
            border-color: #4CAF50;
            box-shadow: 0 0 40px 15px rgba(76, 175, 80, 0.8);
        }

        .glow-wrong.platform {
            filter: drop-shadow(0 0 20px #F44336);
            border-color: #F44336;
            box-shadow: 0 0 40px 15px rgba(244, 67, 54, 0.8);
        }

        .hit-anim #player-sprite {
            animation: hitShake 0.5s !important;
            filter: grayscale(100%) drop-shadow(0 0 20px red);
        }

        @keyframes hitShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-20px, 10px) rotate(-15deg); }
            40% { transform: translate(20px, 20px) rotate(15deg); }
            60% { transform: translate(-20px, 10px) rotate(-15deg); }
            80% { transform: translate(20px, 20px) rotate(15deg); }
        }

        /* 操作按鈕 (避開題目，放右下) */
        #controls {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            background: #FF9800;
            color: white;
            border: 5px solid #FFF;
            border-radius: 25px;
            padding: 20px 45px;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #E65100, 0 15px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #E65100, 0 5px 10px rgba(0,0,0,0.3);
        }

        /* 遊戲結束畫面 */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
        }

        #game-over h1 {
            font-size: 80px;
            margin-bottom: 20px;
            color: #FFEB3B;
            text-shadow: 0 5px 15px rgba(255,235,59,0.5);
        }

        #game-over p {
            font-size: 45px;
            margin-bottom: 50px;
        }
    </style>
</head>
<body onload="init()">

    <div id="game-container">
        <!-- 滾動背景 -->
        <div class="scenery">🌳 ☁️ 🌳  ☁️ 🌳 ☁️ 🌳  ☁️ 🌳 ☁️ 🌳  ☁️ 🌳 ☁️ 🌳  ☁️ 🌳 ☁️ 🌳  ☁️</div>
        <div id="ground"></div>

        <!-- 狀態列 -->
        <div id="ui">
            <div>生命：<span id="hp">❤️❤️❤️</span></div>
            <div><span id="score">分數: 0</span></div>
        </div>

        <!-- 題目區 -->
        <div id="question-box">遊戲準備中...</div>

        <!-- 玩家 -->
        <div id="player" class="lane-bottom">
            <div id="player-sprite">🏃‍♂️</div>
        </div>

        <!-- 飛入的平台 -->
        <div id="plat-top" class="platform lane-top" style="left: -300px;"></div>
        <div id="plat-bottom" class="platform lane-bottom" style="left: -300px;"></div>

        <!-- 操作按鈕 -->
        <div id="controls">
            <button class="btn" id="btn-up">▲ 往上</button>
            <button class="btn" id="btn-down">▼ 往下</button>
        </div>

        <!-- 遊戲結束介面 -->
        <div id="game-over">
            <h1>Game Over</h1>
            <p>總得分：<span id="final-score">0</span> 分</p>
            <button class="btn" onclick="startGame()">再玩一次</button>
        </div>
    </div>

    <script>
        // --- 內建題庫 (小二程度標點符號) ---
        const questions = [
            { question: "今天天氣真好[ ]", optionA: "！", optionB: "，", correctOption: "A" },
            { question: "請問公車站在哪裡[ ]", optionA: "。", optionB: "？", correctOption: "B" },
            { question: "桌子上有鉛筆[ ]橡皮擦和尺。", optionA: "、", optionB: "。", correctOption: "A" },
            { question: "老師說[ ]「大家要把功課寫完。」", optionA: "：", optionB: "，", correctOption: "A" },
            { question: "我有一隻可愛的小狗[ ]", optionA: "。", optionB: "？", correctOption: "A" }
        ];

        // --- 遊戲變數 ---
        let hp = 3;
        let score = 0;
        let currentQIndex = 0;
        let playerLane = 1; // 0 = 上, 1 = 下
        let gameActive = false;
        
        let waveX = window.innerWidth + 200;
        let waveActive = false;
        let correctLaneForWave = 0;
        let evaluated = false;
        let speed = 7;
        let waitTimer = null;

        // DOM 元素
        const playerEl = document.getElementById('player');
        const hpEl = document.getElementById('hp');
        const scoreEl = document.getElementById('score');
        const questionBox = document.getElementById('question-box');
        const platTop = document.getElementById('plat-top');
        const platBottom = document.getElementById('plat-bottom');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        // 初始化設定
        function init() {
            // 按鈕控制
            document.getElementById('btn-up').onclick = () => setPlayerLane(0);
            document.getElementById('btn-down').onclick = () => setPlayerLane(1);
            
            // 鍵盤控制 (輔助測試)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') setPlayerLane(0);
                if (e.key === 'ArrowDown') setPlayerLane(1);
            });

            // 隨機打亂題庫
            questions.sort(() => Math.random() - 0.5);

            startGame();
            requestAnimationFrame(gameLoop);
        }

        // 開始遊戲
        function startGame() {
            hp = 3;
            score = 0;
            currentQIndex = 0;
            gameActive = true;
            evaluated = false;
            waveActive = false;
            
            if (waitTimer) clearInterval(waitTimer);

            updateUI();
            gameOverEl.style.display = 'none';
            setPlayerLane(1);
            
            nextQuestion();
        }

        // 切換跑道
        function setPlayerLane(lane) {
            if (!gameActive) return;
            playerLane = lane;
            playerEl.className = lane === 0 ? 'lane-top' : 'lane-bottom';
        }

        // 更新介面
        function updateUI() {
            hpEl.innerText = '❤️'.repeat(hp);
            scoreEl.innerText = `分數: ${score}`;
        }

        // 生成下一題
        function nextQuestion() {
            if (hp <= 0) return;

            evaluated = false;
            playerEl.classList.remove('glow-correct', 'hit-anim');
            platTop.classList.remove('glow-correct', 'glow-wrong');
            platBottom.classList.remove('glow-correct', 'glow-wrong');

            // 取得題目
            let q = questions[currentQIndex % questions.length];
            questionBox.innerHTML = q.question.replace('[ ]', '<span class="highlight">[ ？ ]</span>');

            // 隨機決定正確答案所在的軌道
            correctLaneForWave = Math.random() > 0.5 ? 0 : 1;
            
            if (correctLaneForWave === 0) {
                platTop.innerText = q.correctOption === 'A' ? q.optionA : q.optionB;
                platBottom.innerText = q.correctOption === 'A' ? q.optionB : q.optionA;
            } else {
                platBottom.innerText = q.correctOption === 'A' ? q.optionA : q.optionB;
                platTop.innerText = q.correctOption === 'A' ? q.optionB : q.optionA;
            }

            // 重置平台位置與速度
            waveX = window.innerWidth + 100;
            speed = Math.max(window.innerWidth / 130, 6); // 依螢幕寬度自動調整速度
            if (speed > 14) speed = 14; 
            
            waveActive = true;
            currentQIndex++;
        }

        // 遊戲主迴圈
        function gameLoop() {
            if (gameActive && waveActive) {
                waveX -= speed;
                platTop.style.left = waveX + 'px';
                platBottom.style.left = waveX + 'px';

                // 碰撞偵測 (以角色與平台的中心點判斷)
                let playerCenterX = window.innerWidth * 0.15 + 50; // 角色 X 中心
                let platCenterX = waveX + 50; // 平台 X 中心

                if (!evaluated && platCenterX <= playerCenterX) {
                    evaluated = true;
                    checkAnswer();
                }

                // 平台移出畫面後隱藏
                if (waveX < -150) {
                    waveActive = false;
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // 判定答案
        function checkAnswer() {
            if (playerLane === correctLaneForWave) {
                // 答對
                score += 100;
                playerEl.classList.add('glow-correct');
                (correctLaneForWave === 0 ? platTop : platBottom).classList.add('glow-correct');
            } else {
                // 答錯
                hp -= 1;
                playerEl.classList.add('hit-anim');
                (playerLane === 0 ? platTop : platBottom).classList.add('glow-wrong');
            }
            
            updateUI();

            if (hp <= 0) {
                gameActive = false;
                setTimeout(() => {
                    gameOverEl.style.display = 'flex';
                    finalScoreEl.innerText = score;
                }, 800);
            } else {
                // 依據需求：每道問題之間等待約 40 秒
                let timeLeft = 40;
                questionBox.innerHTML = `答題結束！等待下一題... 倒數 <span class="highlight">${timeLeft}</span> 秒`;
                
                waitTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        questionBox.innerHTML = `答題結束！等待下一題... 倒數 <span class="highlight">${timeLeft}</span> 秒`;
                    } else {
                        clearInterval(waitTimer);
                        nextQuestion();
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
